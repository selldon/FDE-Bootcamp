# The checks on every pull request to main (docs/brief-ci.md). The same rules as the pre-commit hook, run by GitHub,
# so a hook skipped on a laptop does not skip them. No secret and no key in this file; the eval job comes in a later phase.
name: checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# a newer push to the same pull request replaces the run still going
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      # the labs in sandbox/ and the build folders under builds/ are not the product (as in .pre-commit-config.yaml)
      - run: ruff check . --extend-exclude sandbox --extend-exclude builds
      - run: git ls-files '*.py' ':!:sandbox' ':!:builds' | xargs mypy
      - run: python -m pytest -q -m "not live"

  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npx tsc -b
