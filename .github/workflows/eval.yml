# The eval gate (docs/brief-ci.md): the replay of the 40 labeled conversations with real Claude. Called by checks.yml (every
# pull request) and, later, by the nightly run. It passes only at the goal: at least 36 of 40 right actions and nobody who
# needs a person left with the assistant (`replay.py --gate`). The replay writes nothing: drafts, tasks and traces go to fakes.
# DemoStore's systems start on the runner from sandbox/systems/compose.yaml; the values below are the test values of the
# local copy (.env.example), not secrets. The key is given to ONE step, the replay: no other step calls Claude.
name: eval

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false  # a pull request from a fork has none; the first step says so and fails

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f sandbox/systems/compose.yaml
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.models
      # a fixed instant, so the carrier's old files are fresh and the replay gives the same answers every day
      DEMOSTORE_NOW: "2026-10-22T05:00:00+00:00"
      LEDGERLINE_DSN: localhost:1521/FREEPDB1
      LEDGERLINE_USER: LL_READER
      LEDGERLINE_PASSWORD: reader
      CARRIER_HOST: 127.0.0.1
      CARRIER_PORT: "2222"
      CARRIER_USER: demostore
      CARRIER_PASSWORD: feed
      STORE_URL: postgresql://demostore:demostore@127.0.0.1:5432/product
      CONFLUENCE_URL: http://127.0.0.1:8040
      TRACE_HMAC_KEY: ci-test-key-not-a-secret
    steps:
      - name: A fork gets no key
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::This pull request comes from a fork, so GitHub gives it no key. A maintainer must run the eval from a branch in this repository."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: pip install -r requirements-runtime.txt
      # the embedding model comes from the web once, then from the cache
      - uses: actions/cache@v4
        with:
          path: .models
          key: fastembed-BAAI-bge-small-en-v1.5
      - name: Start DemoStore's systems
        run: $COMPOSE up -d --wait ledgerline carrier ourdb confluence
      - name: Wait until the systems are ready
        run: |
          # compose waits for Oracle's health check; PostgreSQL restarts once after its init scripts, so wait for the end of them
          timeout 180 bash -c 'until $COMPOSE logs ourdb 2>&1 | grep -q "init process complete"; do sleep 2; done'
          timeout 120 bash -c 'until python -c "import psycopg,os; psycopg.connect(os.environ[\"STORE_URL\"]).close()" 2>/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -fs "$CONFLUENCE_URL/" >/dev/null || curl -s -o /dev/null "$CONFLUENCE_URL/"; do sleep 2; done'
      # these two steps do not call Claude: no key in their environment
      - name: Load the order store
        run: python pipeline.py
      - name: Build the policy index
        run: python policy_index.py
      - name: Replay the 40 conversations
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          status=0
          python replay.py --gate > replay.txt || status=$?
          cat replay.txt
          { echo '### Replay of the 40 conversations'; echo '```'; cat replay.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Logs of the systems
        if: failure()
        run: $COMPOSE logs --no-color --tail 40
