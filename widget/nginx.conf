server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's resolver and a variable: nginx starts even if the chat service is not up yet,
    # and finds it again at its new address after a restart
    resolver 127.0.0.11 valid=10s;
    set $chat http://chat:8000;

    location ~ ^/(chat|verify|erase)(/|$) {
        proxy_pass $chat;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;  # a reply can take several model calls
    }

    location / {
        try_files $uri /index.html;
    }
}
